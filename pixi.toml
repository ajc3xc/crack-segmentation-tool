[workspace]
name = "crack-segmentation-tool"
version = "0.1.0"
channels = ["conda-forge", "agd-lbr"]
platforms = ["linux-64", "win-64"]

[tasks]

# ==========================
# Core Numerical Stack
# ==========================

[dependencies]
python = "3.11.*"

# Numerical core (PIN THESE)
numpy = "1.26.*"
scipy = "1.11.*"
matplotlib = "3.8.*"
scikit-image = "0.19.*"
opencv = "4.11.*"

seaborn = "*"
psutil = "*"
hfm = "0.2.13.*"
cupy = "12.*"
cudatoolkit = ">=11.8.0,<12"
fontconfig = "*"

# ==========================
# CUDA + CuPy (GPU Support)
# ==========================

#[target.linux-64.dependencies]
#cudatoolkit = "11.8.*"
#cupy = "12.2.*"

#[target.win-64.dependencies]
#cudatoolkit = "11.8.*"
#cupy = "12.2.*"

# ==========================
# PyPI Packages
# ==========================

[pypi-dependencies]
pyqt5 = ">=5.15.11,<6"
plotly = ">=6,<7"
scikit-fmm = "*"
agd = ">=0.2.16,<0.3"
shapely = ">=2,<3"
pandas = "*"
rasterio = ">=1.3,<2"
opencv-python = "*"

# ==========================
# Linux Qt Fix
# ==========================

[target.linux-64.activation.env]
QT_QPA_PLATFORM_PLUGIN_PATH = ".pixi/envs/default/plugins/platforms"
XDG_RUNTIME_DIR = "/tmp"
