[workspace]
name = "crack-segmentation-tool"
version = "0.1.0"
channels = ["conda-forge", "agd-lbr"]
platforms = ["linux-64", "win-64"]

[tasks]

# ==========================
# Core Numerical Stack
# ==========================

[dependencies]
python = "3.11.*"

# Numerical core (PIN THESE)
numpy = "1.26.*"
scipy = "1.11.*"
matplotlib = "3.8.*"
scikit-image = "0.19.*"

seaborn = "*"
psutil = "*"
hfm = "0.2.13.*"
cupy = "13.*"

# ==========================
# CUDA + CuPy (GPU Support)
# ==========================

[target.linux-64.dependencies]
cudatoolkit = "11.8.*"
#cupy = "12.2.*"

[target.win-64.dependencies]
cudatoolkit = "11.8.*"
#cupy = "12.2.*"

# ==========================
# PyPI Packages
# ==========================

[pypi-dependencies]
pyqt5 = ">=5.15.11,<6"
opencv-contrib-python = ">=4.11,<5"
plotly = ">=6,<7"
scikit-fmm = "*"
agd = ">=0.2.16,<0.3"
shapely = ">=2,<3"
pandas = "*"
rasterio = ">=1.3,<2"

# ==========================
# Linux Qt Fix
# ==========================

[target.linux-64.activation.env]
QT_QPA_PLATFORM_PLUGIN_PATH = ".pixi/envs/default/lib/python3.11/site-packages/PyQt5/Qt5/plugins/platforms"
